<script>

(function () {
  var host = location.hostname || "";
  try {
    if (host.indexOf("crazygames") !== -1) {
      var s1 = document.createElement("script");
      s1.src = "https://sdk.crazygames.com/crazygames-sdk-v3.js";
      s1.onload = function () {
        if (window.CrazyGames && window.CrazyGames.SDK) {
          window.CrazyGames.SDK.init().then(function () {
            try { window.CrazyGames.SDK.game.loadingStart(); } catch (e) {}
            window.addEventListener("load", function () { try { window.CrazyGames.SDK.game.loadingStop(); } catch (e) {} });
          }).catch(function () {});
        }
      };
      document.head.appendChild(s1);
      window.__portal = "crazygames";
    } else if (host.indexOf("gamedistribution") !== -1 || host.indexOf("html5.gamedistribution.com") !== -1 || host.indexOf("gd.games") !== -1) {
      var s2 = document.createElement("script");
      s2.src = "https://sdk.gamedistribution.com/v2/main.min.js";
      document.head.appendChild(s2);
      window.__portal = "gamedistribution";
    }
  } catch (e) {}
})();

<style>

<body>
<div id="wrap">

<script>
"use strict";
/* ============ 纯逻辑层：无 DOM / Canvas / Audio，可在 node vm 中直接运行 ============
   坐标系：竖屏巷道，世界向左卷动（卷速随时间上升）。喷气人横坐标固定，按住喷气上升、
   松开重力下坠，只控制高度躲开：竖直激光墙（留缺口）、旋转激光炮塔、跟踪导弹。 */
var JD = (function () {
  var W = 480, H = 720;              // 逻辑分辨率（竖屏优先）
  var PX = 130;                      // 玩家固定横坐标
  var PR = 13;                       // 玩家碰撞半径
  var PX_PER_M = 10;                 // 10px = 1 米
  var NEAR_PX = 30;                  // near-miss 表面距离阈值
  var GRAV = 1450, THRUST = 2950, VMAX = 620;  // 纵向物理（按住净加速 1500 向上）
  var TOP = 26, BOT = H - 26;        // 巷道上下界（安全，贴边滑动）
  var WALL_TH = 14, BEAM_R = 5;      // 激光墙厚 / 光束半径
  var MISSILE_R = 10;
  var MISSILE_HOME = 4;              // 导弹跟踪 4 秒后直飞
  var MISSILE_TURN = 3.3;            // 导弹转向率（rad/s），急变向可甩掉
  var MISSILE_MAXAGE = 7.5;          // 导弹寿命上限（s）
  var MIN_SPACING = 260;             // 相邻障碍最小间距
  var SPAWN_X = W + 60;              // 障碍生成横坐标（屏幕外）

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  /* ---- 几何原语（测试用独立实现比对） ---- */
  // 点到矩形表面距离（矩形内部为 0）
  function pointRect(px, py, x, y, w, h) {
    var dx = Math.max(x - px, 0, px - (x + w));
    var dy = Math.max(y - py, 0, py - (y + h));
    return Math.sqrt(dx * dx + dy * dy);
  }
  // 点到线段距离
  function pointSeg(px, py, ax, ay, bx, by) {
    var abx = bx - ax, aby = by - ay;
    var len2 = abx * abx + aby * aby;
    var t = len2 ? ((px - ax) * abx + (py - ay) * aby) / len2 : 0;
    t = clamp(t, 0, 1);
    var dx = px - (ax + abx * t), dy = py - (ay + aby * t);
    return Math.sqrt(dx * dx + dy * dy);
  }

  /* ---- 危险物判定：返回表面距离 d（d<=0 碰撞；0<d<=NEAR_PX 为 near-miss） ---- */
  // gate：竖直激光墙，上下两段，中间留缺口（gap），玩家控制高度从缺口穿过
  function evalHazard(hz, px, py, pr) {
    var d = Infinity, i, dx, dy, n, a, bx, by;
    if (hz.type === "gate") {
      var g1 = hz.gc - hz.gapH / 2, g2 = hz.gc + hz.gapH / 2;
      d = Math.min(
        pointRect(px, py, hz.x, 0, WALL_TH, g1),
        pointRect(px, py, hz.x, g2, WALL_TH, H - g2)
      ) - pr;
    } else if (hz.type === "turret") {
      dx = px - hz.x; dy = py - hz.y;
      d = Math.sqrt(dx * dx + dy * dy) - hz.hubR - pr;
      n = hz.beams || 2;
      for (i = 0; i < n; i++) {
        a = hz.ang + i * (Math.PI * 2 / n);
        bx = hz.x + Math.cos(a) * hz.L; by = hz.y + Math.sin(a) * hz.L;
        d = Math.min(d, pointSeg(px, py, hz.x, hz.y, bx, by) - BEAM_R - pr);
      }
    } else if (hz.type === "missile") {
      dx = px - hz.x; dy = py - hz.y;
      d = Math.sqrt(dx * dx + dy * dy) - MISSILE_R - pr;
    }
    return { d: d, hit: d <= 0, near: d > 0 && d <= NEAR_PX };
  }

  function createState() {
    return {
      W: W, H: H,
      time: 0, dist: 0, score: 0, bonus: 0, nearCount: 0,
      sy: H * 0.5, sv: 0, thrusting: false,
      scrollS: 150, diff: 0,
      slowmo: 0, shield: false, invuln: 0,
      dead: false, deadT: 0,
      obstacles: [], missiles: [], pickups: [],
      distSince: 0, nextSpacing: 430, prevGc: H / 2,
      missileCd: 3, nextShield: 800,
      events: [], nextId: 1
    };
  }

  function spawnObstacle(st) {
    var d = st.diff, id = st.nextId++;
    var type = "gate";
    if (st.time > 6 && Math.random() < 0.16 + 0.14 * d) type = "turret";
    if (type === "gate") {
      var gapH = clamp(176 - 50 * d, 128, 176) * rand(0.94, 1.06);
      // 缺口中心位移上限随卷速收紧，保证纵向可达
      var maxShift = Math.min(0.6 * st.nextSpacing * 520 / st.scrollS, 420);
      var gc = clamp(st.prevGc + rand(-1, 1) * maxShift, TOP + gapH / 2 + 22, BOT - gapH / 2 - 22);
      st.obstacles.push({ type: "gate", id: id, x: SPAWN_X, gc: gc, gapH: gapH, nearDone: false });
      st.prevGc = gc;
    } else {
      var topSide = Math.random() < 0.5;
      var hy = topSide ? 64 : H - 64;
      var beams = (d > 0.55 && Math.random() < 0.4) ? 4 : 2;
      var L = 150 + 46 * d; if (beams === 4) L *= 0.82;
      st.obstacles.push({ type: "turret", id: id, x: SPAWN_X, y: hy, ang: rand(0, Math.PI * 2),
        om: (1.5 + 1.7 * d) * (Math.random() < 0.5 ? -1 : 1) * (beams === 4 ? 0.85 : 1),
        L: L, beams: beams, hubR: 21, nearDone: false });
    }
  }

  function hitPlayer(st, d, id) {
    if (st.shield) {
      st.shield = false;
      st.invuln = 1.2;             // 护盾抵挡一次 + 短暂无敌
      st.events.push({ type: "shieldbreak", x: PX, y: st.sy });
    } else {
      st.dead = true;
      st.deadT = 0;
      st.events.push({ type: "dead", x: PX, y: st.sy, d: d, id: id });
    }
  }

  function step(st, input, dtG, dtR) {
    // dt 上限：防切后台后瞬移
    dtG = Math.min(dtG, 1 / 30); dtR = Math.min(dtR, 1 / 30);
    if (st.dead) { st.deadT += dtR; return; }
    if (st.slowmo > 0) st.slowmo = Math.max(0, st.slowmo - dtR);
    if (st.invuln > 0) st.invuln = Math.max(0, st.invuln - dtG);
    var thrust = !!(input && input.thrust);
    var i, hz, m;

    /* ---- 难度与卷动 ---- */
    st.time += dtG;
    st.diff = Math.min(1, st.dist / 16000);
    st.scrollS = 150 + 195 * st.diff;
    var S = st.scrollS;

    /* ---- 玩家物理（sv 向下为正） ---- */
    var sv = st.sv + GRAV * dtG;
    if (thrust) sv -= THRUST * dtG;
    st.sv = clamp(sv, -VMAX, VMAX);
    var sy = st.sy + st.sv * dtG;
    if (sy < TOP) { sy = TOP; if (st.sv < 0) st.sv = 0; }
    if (sy > BOT) { sy = BOT; if (st.sv > 0) st.sv = 0; }
    st.sy = sy;
    st.thrusting = thrust;

    /* ---- 里程 / 高度 ---- */
    st.dist += S * dtG;

    /* ---- 障碍左移与离场 ---- */
    for (i = st.obstacles.length - 1; i >= 0; i--) {
      hz = st.obstacles[i];
      hz.x -= S * dtG;
      if (hz.type === "turret") hz.ang += hz.om * dtG;
      if (hz.x < -260) st.obstacles.splice(i, 1);
    }

    /* ---- 障碍生成（按卷动里程调度，保证横向间距） ---- */
    st.distSince += S * dtG;
    st.nextSpacing = clamp(430 - 130 * st.diff, 300, 430) + rand(0, 60);
    if (st.distSince >= st.nextSpacing) {
      st.distSince = 0;
      spawnObstacle(st);
      st.events.push({ type: "spawn" });
    }

    /* ---- 道具 ---- */
    for (i = st.pickups.length - 1; i >= 0; i--) {
      var pk = st.pickups[i];
      pk.x -= S * dtG; pk.t += dtG;
      if (pk.x < -40) { st.pickups.splice(i, 1); continue; }
      var pdx = pk.x - PX, pdy = pk.y - st.sy, pr2 = PR + 17;
      if (pdx * pdx + pdy * pdy < pr2 * pr2) {
        st.pickups.splice(i, 1);
        if (st.shield) { st.bonus += 10; st.events.push({ type: "shieldbonus", x: pk.x, y: pk.y }); }
        else { st.shield = true; st.events.push({ type: "shieldget", x: pk.x, y: pk.y }); }
      }
    }

    /* ---- 导弹：侧边警告 -> 跟踪 4s -> 直飞；出界或寿命终止即移除 ---- */
    for (i = st.missiles.length - 1; i >= 0; i--) {
      m = st.missiles[i];
      m.age += dtG;
      if (m.phase === "warn") {
        m.t -= dtG;
        m.y = clamp(st.sy, TOP, BOT); // 锁定阶段跟随玩家
        if (m.t <= 0) {
          m.phase = "fly"; m.age = 0; m.nearDone = false;
          m.x = m.side < 0 ? -24 : W + 24;
          var sp = 295 + 70 * st.diff;
          var ty = clamp(st.sy + st.sv * 0.4, TOP, BOT); // 预判航向
          var a0 = Math.atan2(ty - m.y, PX - m.x);
          m.vx = Math.cos(a0) * sp; m.vy = Math.sin(a0) * sp; m.sp = sp;
        }
      } else {
        if (m.age < MISSILE_HOME) { // 有限转向率追踪
          var want = Math.atan2(st.sy - m.y, PX - m.x);
          var cur = Math.atan2(m.vy, m.vx);
          var dd = want - cur;
          while (dd > Math.PI) dd -= Math.PI * 2;
          while (dd < -Math.PI) dd += Math.PI * 2;
          var turn = clamp(dd, -MISSILE_TURN * dtG, MISSILE_TURN * dtG);
          cur += turn;
          m.vx = Math.cos(cur) * m.sp; m.vy = Math.sin(cur) * m.sp;
        }
        m.x += m.vx * dtG; m.y += m.vy * dtG;
        if (m.x < -90 || m.x > W + 90 || m.y < -90 || m.y > H + 90 || m.age > MISSILE_MAXAGE) {
          st.missiles.splice(i, 1);
          st.missileCd = rand(4, 6.5) - st.diff; // 移除后冷却，下一枚
        }
      }
    }
    if (st.missiles.length === 0 && st.score >= 40) {
      st.missileCd -= dtG;
      if (st.missileCd <= 0) {
        st.missiles.push({ phase: "warn", t: 0.8, side: Math.random() < 0.5 ? -1 : 1, y: st.sy, age: 0 });
        st.events.push({ type: "alarm" });
      }
    }

    /* ---- 分数：高度 10m=1 分 + near miss 2 分 + 奖励 ---- */
    st.score = Math.floor(st.dist / (PX_PER_M * 10)) + st.nearCount * 2 + st.bonus;

    /* ---- 护盾补给：每 800 分一个 ---- */
    while (st.score >= st.nextShield) {
      st.nextShield += 800;
      var px2 = SPAWN_X;
      for (var k = 0; k < st.obstacles.length; k++) { // 避免刷在障碍里
        if (Math.abs(st.obstacles[k].x - px2) < 100) px2 = Math.max(px2, st.obstacles[k].x) + 130;
      }
      st.pickups.push({ x: px2, y: rand(80, H - 80), t: 0 });
    }

    /* ---- 碰撞与 near-miss（使用 evalHazard，与几何参照一致） ---- */
    if (st.invuln <= 0) {
      for (i = 0; i < st.obstacles.length; i++) {
        hz = st.obstacles[i];
        var res = evalHazard(hz, PX, st.sy, PR);
        if (res.hit) { hitPlayer(st, res.d, hz.id); break; }
        if (res.near && !hz.nearDone) {
          hz.nearDone = true;
          st.nearCount++;
          st.slowmo = 0.2; // 慢动作 0.2 秒
          st.events.push({ type: "near", x: PX, y: st.sy, d: res.d, id: hz.id });
        }
      }
      if (!st.dead) {
        for (i = st.missiles.length - 1; i >= 0; i--) {
          m = st.missiles[i];
          if (m.phase !== "fly") continue;
          var mdx = m.x - PX, mdy = m.y - st.sy;
          var md = Math.sqrt(mdx * mdx + mdy * mdy) - MISSILE_R - PR;
          if (md <= 0) {
            hitPlayer(st, md, "m" + i);
            if (st.invuln > 0) st.missiles.splice(i, 1); // 护盾挡下导弹
            break;
          }
          if (md <= NEAR_PX && !m.nearDone) {
            m.nearDone = true;
            st.nearCount++;
            st.slowmo = 0.2;
            st.events.push({ type: "near", x: m.x, y: m.y, d: md, id: "m" + i });
          }
        }
      }
    }
  }

  return {
    CONST: { W: W, H: H, PX: PX, PR: PR, NEAR_PX: NEAR_PX, TOP: TOP, BOT: BOT, GRAV: GRAV, THRUST: THRUST,
      VMAX: VMAX, WALL_TH: WALL_TH, BEAM_R: BEAM_R, MISSILE_R: MISSILE_R, MISSILE_HOME: MISSILE_HOME,
      MISSILE_TURN: MISSILE_TURN, MISSILE_MAXAGE: MISSILE_MAXAGE, MIN_SPACING: MIN_SPACING, PX_PER_M: PX_PER_M,
      SPAWN_X: SPAWN_X },
    createState: createState,
    step: step,
    evalHazard: evalHazard,
    pointRect: pointRect,
    pointSeg: pointSeg,
    clamp: clamp
  };
})();
if (typeof window !== "undefined") window.JD = JD;
</script>
<script>
"use strict";
/* ============ UI 层：渲染 / 音效 / 输入 / 平台事件 ============ */
var C = JD.CONST, W = C.W, H = C.H;
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var stage = document.getElementById("stage");
var overlay = document.getElementById("overlay");
var muteBtn = document.getElementById("muteBtn");

var state = "ready"; // ready | play | over
var st = JD.createState();
var uiTime = 0, shakeT = 0, overlayShown = false, newBest = false, beatBest = false;
var particles = [], floats = [], rings = [];
var best = 0;
try { best = parseInt(localStorage.getItem("jd_best") || "0", 10) || 0; } catch (e) {}

/* ---- 自适应（竖屏优先，窗口内等比缩放） ---- */
var scaleF = 1;
function fit() {
  var s = Math.min(window.innerWidth / W, window.innerHeight / H);
  var cw = Math.max(200, Math.floor(W * s)), chh = Math.max(300, Math.floor(H * s));
  stage.style.width = cw + "px"; stage.style.height = chh + "px";
  canvas.style.width = cw + "px"; canvas.style.height = chh + "px";
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(chh * dpr);
  scaleF = canvas.width / W;
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", fit);
fit();

/* ---- 音效：全部 WebAudio 合成 ---- */
var AC = window.AudioContext || window.webkitAudioContext;
var actx = null, master = null, jetGain = null, muted = false, alarmT = 0;
try { muted = localStorage.getItem("jd_mute") === "1"; } catch (e) {}
function initAudio() {
  if (actx || !AC) return;
  try {
    actx = new AC();
    master = actx.createGain();
    master.gain.value = muted ? 0 : 1;
    master.connect(actx.destination);
    var len = actx.sampleRate, buf = actx.createBuffer(1, len, actx.sampleRate), ch = buf.getChannelData(0);
    for (var i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    var src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
    var filt = actx.createBiquadFilter(); filt.type = "bandpass"; filt.frequency.value = 640; filt.Q.value = 0.7;
    jetGain = actx.createGain(); jetGain.gain.value = 0;
    src.connect(filt); filt.connect(jetGain); jetGain.connect(master);
    src.start();
  } catch (e) { actx = null; }
}
function resumeAudio() { try { if (actx && actx.state === "suspended") actx.resume(); } catch (e) {} }
function setJet(on) {
  if (!actx || !jetGain) return;
  try {
    var t = actx.currentTime;
    jetGain.gain.cancelScheduledValues(t);
    jetGain.gain.setTargetAtTime(on ? 0.16 : 0, t, 0.06);
  } catch (e) {}
}
function beep(freq, dur, type, gainv, slideTo, delay) {
  if (!actx) return;
  try {
    var t0 = actx.currentTime + (delay || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(gainv || 0.1, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}
function noiseBurst(dur, gainv, freq) {
  if (!actx) return;
  try {

      rings.push({ x: C.PX, y: st.sy, r: 6, life: 0.55 });

}

/* ---- 背景：星空 + 底部城市剪影双层视差（离屏程序化贴图，横向无缝循环） ---- */
function mulberry32(a) {
  return function () {

    var bh = 40 + Math.floor(rng() * (hgt - 60));
    var bw = colW - 3;
    g.fillStyle = base; g.fillRect(bx, hgt - bh, bw, bh);
    g.fillStyle = line; g.fillRect(bx, hgt - bh, bw, 2);
    if (rng() < 0.4) { g.fillStyle = line; g.fillRect(bx + bw / 2 - 1, hgt - bh - 10, 2, 10); } // 天线
    for (var wy = hgt - bh + 6; wy < hgt - 8; wy += 10) {

}

/* ---- 主循环 ---- */
var last = performance.now();
function frame(t) {
  var dtR = Math.min((t - last) / 1000, 1 / 30);
  last = t;
  uiTime += dtR;
  if (shakeT > 0) shakeT = Math.max(0, shakeT - dtR);
  var scrollSrc = uiTime * 46;
  if (state === "play" || state === "over") {
    var scale = st.slowmo > 0 ? 0.35 : 1; // near-miss 慢动作
    var thrust = held() && state === "play" && !st.dead;
    JD.step(st, { thrust: thrust }, dtR * scale, dtR);
    drainEvents();
    setJet(thrust);
    scrollSrc = st.dist;
    // 导弹警报节拍
    if (st.missiles.length > 0) {
      alarmT -= dtR;
      if (alarmT <= 0) { beep(940, 0.07, "square", 0.06); alarmT = 0.26; }
    }
    if (st.score > best && !beatBest && best > 0) {
      beatBest = true;
      floatText(W / 2, H * 0.3, "NEW BEST!", "#7effb0");
      beep(1046, 0.12, "triangle", 0.1, 1568);
    }
    if (state === "over" && !overlayShown && st.deadT > 0.65) {
      overlayShown = true;
      showOverPanel();
    }
  }
  render(scrollSrc, state === "ready", dtR);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---- 调试/测试钩子（不影响游戏逻辑） ---- */
window.__jd = {
  get state() { return state; },
  get st() { return st; },
  get held() { return held(); },
  JD: JD
};
</script>
